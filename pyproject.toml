[project]
name = "vllm-smart-proxy"
version = "0.4.0"
description = "Transparent multi-port proxy with automatic vLLM sleep/wake management"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "psutil>=6,<8",
  "nvidia-ml-py>=12,<14",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
