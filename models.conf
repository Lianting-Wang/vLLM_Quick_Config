[defaults]
default_profile=qwen3.6_uncensored
cuda_visible_devices=0,1
host=127.0.0.1
port=4000
enable_sleep_mode=true
server_dev_mode=true
max_num_seqs=8
max_num_batched_tokens=8192
max_model_len=auto
gpu_memory_utilization=0.5
tensor_parallel_size=2
enable_prefix_caching=true
enable_auto_tool_choice=true

[qwen3.6_uncensored]
model=llmfan46/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-GPTQ-Int4
served_model_name=qwen3.6
reasoning_parser=qwen3
enable_thinking=true
tool_call_parser=qwen3_coder
speculative_config={"method":"mtp","num_speculative_tokens":3}
cudagraph_mode=PIECEWISE

[qwen3.6]
model=qwen/Qwen3.6-27B-FP8
served_model_name=qwen3.6
reasoning_parser=qwen3
enable_thinking=true
tool_call_parser=qwen3_coder

[minicpm5_1b_fast]
model=openbmb/MiniCPM5-1B
served_model_name=minicpm5
cuda_visible_devices=1
port=4001
tensor_parallel_size=1
max_num_seqs=1
max_num_batched_tokens=8192
max_model_len=auto
gpu_memory_utilization=0.38
enable_prefix_caching=false
enable_auto_tool_choice=false
enable_thinking=false
cudagraph_mode=FULL
